<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LazyCut System Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, serif;
      --font-mono:     'Geist Mono', monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.4vw + 0.8rem, 2.2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1120px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · System Topology</p>
    <h1>LazyCut System Architecture</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1160 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lazycut-arch-title lazycut-arch-desc">
        <title id="lazycut-arch-title">LazyCut System Architecture</title>
        <desc id="lazycut-arch-desc">High-level architectural blueprint of LazyCut showing host ingestion, single-process FastAPI core backend, video processing engines, and local export boundaries.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <!-- Canvas Background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ================= ZONES ================= -->
        <!-- 1. Host Ingestion Zone -->
        <rect x="40" y="60" width="260" height="480" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <rect x="52" y="64" width="136" height="14" rx="2" fill="#f5f5f5"/>
        <text x="120" y="75" fill="#5a6580" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HOST INGESTION</text>

        <!-- 2. Core Backend Zone -->
        <rect x="330" y="60" width="480" height="480" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <rect x="342" y="64" width="168" height="14" rx="2" fill="#f5f5f5"/>
        <text x="426" y="75" fill="#5a6580" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">FASTAPI CORE ENGINE</text>

        <!-- 3. Client & Export Zone -->
        <rect x="840" y="60" width="280" height="480" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <rect x="852" y="64" width="156" height="14" rx="2" fill="#f5f5f5"/>
        <text x="930" y="75" fill="#5a6580" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLIENT & EXPORTS</text>

        <!-- ================= CONNECTORS (Drawn Before Nodes) ================= -->

        <!-- 1. Source Clips -> Folder Watcher (Straight down) -->
        <path d="M 170,190 V 312" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="138" y="244" width="64" height="14" rx="2" fill="#f5f5f5"/>
        <text x="170" y="254" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DETECT</text>

        <!-- 2. Folder Watcher -> OpenCV Detector (Straight right) -->
        <path d="M 280,380 H 352" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="290" y="360" width="58" height="14" rx="2" fill="#f5f5f5"/>
        <text x="319" y="370" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRIGGER</text>

        <!-- 3. Folder Watcher -> FastAPI Backend (Right + Up Elbow) -->
        <path d="M 280,340 H 424 Q 432,340 432,332 V 202" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="390" y="270" width="76" height="14" rx="2" fill="#f5f5f5"/>
        <text x="428" y="280" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVENT PUSH</text>

        <!-- 4. OpenCV Detector -> FastAPI Backend (Straight vertical) -->
        <path d="M 470,330 V 202" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="435" y="245" width="82" height="14" rx="2" fill="#f5f5f5"/>
        <text x="476" y="255" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KILL METRICS</text>

        <!-- 5. FastAPI Backend -> FFmpeg Engine (Straight horizontal, Accent) -->
        <path d="M 550,154 H 602" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="556" y="132" width="46" height="14" rx="2" fill="#f5f5f5"/>
        <text x="579" y="142" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DISPATCH</text>

        <!-- 6. FastAPI Backend -> State & Presets (Down + Right Elbow) -->
        <path d="M 515,194 V 256 Q 515,264 523,264 H 632 Q 640,264 640,272 V 322" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="546" y="257" width="56" height="14" rx="2" fill="#f5f5f5"/>
        <text x="574" y="267" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PERSIST</text>

        <!-- 7. FFmpeg Engine -> State & Presets (Straight vertical) -->
        <path d="M 695,194 V 322" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="660" y="245" width="70" height="14" rx="2" fill="#f5f5f5"/>
        <text x="695" y="255" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOB STATUS</text>

        <!-- 8. FFmpeg Engine -> Exported Reels (Right + Down Elbow, Accent) -->
        <path d="M 790,154 H 822 Q 830,154 830,162 V 352 Q 830,360 838,360 H 862" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="792" y="215" width="74" height="14" rx="2" fill="#f5f5f5"/>
        <text x="829" y="225" fill="#bf4520" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RENDER REEL</text>

        <!-- 9. Web Dashboard -> FastAPI Backend (Top routing channel) -->
        <path d="M 960,110 V 96 Q 960,88 952,88 H 458 Q 450,88 450,96 V 102" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="656" y="81" width="88" height="14" rx="2" fill="#f5f5f5"/>
        <text x="700" y="91" fill="#2e5aa8" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REST / WS SYNC</text>

        <!-- 10. Web Dashboard -> Exported Reels (Straight vertical) -->
        <path d="M 980,190 V 322" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="946" y="245" width="68" height="14" rx="2" fill="#f5f5f5"/>
        <text x="980" y="255" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DOWNLOAD</text>

        <!-- ================= NODES ================= -->

        <!-- Node 1: Source Clips (Host Ingestion) -->
        <rect x="60" y="110" width="220" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="60" y="110" width="220" height="80" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
        <rect x="68" y="116" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.3)" stroke-width="0.8"/>
        <text x="86" y="125" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
        <text x="170" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Source Clips</text>
        <text x="170" y="168" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">5s–45s · in-place read</text>

        <!-- Node 2: Folder Watcher (Host Ingestion) -->
        <rect x="60" y="320" width="220" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="60" y="320" width="220" height="80" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
        <rect x="68" y="326" width="46" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.3)" stroke-width="0.8"/>
        <text x="91" y="335" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DAEMON</text>
        <text x="170" y="358" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Folder Watcher</text>
        <text x="170" y="378" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">watchdog · game guard</text>

        <!-- Node 3: FastAPI Backend [FOCAL 1] -->
        <rect x="360" y="110" width="190" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="360" y="110" width="190" height="84" rx="6" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1.4"/>
        <rect x="368" y="116" width="34" height="12" rx="2" fill="transparent" stroke="#bf4520" stroke-width="0.8"/>
        <text x="385" y="125" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="455" y="148" fill="#2d3142" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FastAPI Backend</text>
        <text x="455" y="168" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">single process · port 8000</text>

        <!-- Node 4: OpenCV Detector -->
        <rect x="360" y="330" width="190" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="360" y="330" width="190" height="80" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
        <rect x="368" y="336" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.3)" stroke-width="0.8"/>
        <text x="388" y="345" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VISION</text>
        <text x="455" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OpenCV Detector</text>
        <text x="455" y="388" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">killfeed · action window</text>

        <!-- Node 5: FFmpeg Engine [FOCAL 2] -->
        <rect x="610" y="110" width="180" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="610" y="110" width="180" height="84" rx="6" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1.4"/>
        <rect x="618" y="116" width="46" height="12" rx="2" fill="transparent" stroke="#bf4520" stroke-width="0.8"/>
        <text x="641" y="125" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RENDER</text>
        <text x="700" y="148" fill="#2d3142" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FFmpeg Engine</text>
        <text x="700" y="168" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">NVENC · AMF · ducking</text>

        <!-- Node 6: State & Presets -->
        <rect x="610" y="330" width="180" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="610" y="330" width="180" height="80" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
        <rect x="618" y="336" width="50" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.3)" stroke-width="0.8"/>
        <text x="643" y="345" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORAGE</text>
        <text x="700" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">State & Presets</text>
        <text x="700" y="388" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">lazycut.db · presets/*.json</text>

        <!-- Node 7: Web Dashboard -->
        <rect x="870" y="110" width="220" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="870" y="110" width="220" height="80" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
        <rect x="878" y="116" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.3)" stroke-width="0.8"/>
        <text x="900" y="125" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
        <text x="980" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Web Dashboard</text>
        <text x="980" y="168" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">React SPA · feed & studio</text>

        <!-- Node 8: Exported Reels -->
        <rect x="870" y="330" width="220" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="870" y="330" width="220" height="80" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
        <rect x="878" y="336" width="46" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.3)" stroke-width="0.8"/>
        <text x="901" y="345" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUTPUT</text>
        <text x="980" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Exported Reels</text>
        <text x="980" y="388" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">1080p60 MP4 · chapters.txt</text>

        <!-- ================= LEGEND STRIP (Horizontal Bottom) ================= -->
        <line x1="40" y1="570" x2="1120" y2="570" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

        <!-- Legend Item 1 -->
        <rect x="50" y="590" width="16" height="12" rx="2" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="74" y="600" fill="#2d3142" font-size="8.5" font-family="'Geist', sans-serif">Core Engine (Focal)</text>

        <!-- Legend Item 2 -->
        <rect x="230" y="590" width="16" height="12" rx="2" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
        <text x="254" y="600" fill="#2d3142" font-size="8.5" font-family="'Geist', sans-serif">Service Component</text>

        <!-- Legend Item 3 -->
        <line x1="420" y1="596" x2="446" y2="596" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="456" y="600" fill="#2d3142" font-size="8.5" font-family="'Geist', sans-serif">Primary Video Flow</text>

        <!-- Legend Item 4 -->
        <line x1="620" y1="596" x2="646" y2="596" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="656" y="600" fill="#2d3142" font-size="8.5" font-family="'Geist', sans-serif">Internal Event / State</text>

        <!-- Legend Item 5 -->
        <line x1="840" y1="596" x2="866" y2="596" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="876" y="600" fill="#2d3142" font-size="8.5" font-family="'Geist', sans-serif">REST / WebSocket API</text>

      </svg>
    </div>
  </div>
</body>
</html>
